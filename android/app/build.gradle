plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.vortex.tunnel'
    compileSdk 34

    defaultConfig {
        applicationId "com.vortex.tunnel"
        minSdk 24
        targetSdk 34
        versionCode 26
        versionName "2.6.0-OTA"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        fixedRelease {
            storeFile file("dragon-vortex.jks")
            storePassword "dragon123"
            keyAlias "dragonvortex"
            keyPassword "dragon123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixedRelease
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.fixedRelease
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
}
