[package]
name = "vortex-core"
version = "2.0.0"
edition = "2021"
description = "Ultra-lightweight Rust Tunnel Engine (Split-TLS, HTTP Payload Injector, SOCKS5/HTTP Hotshare, IP Hunter & Android JNI)"

[lib]
name = "vortex_core"
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"

[[bin]]
name = "vortex-core"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
