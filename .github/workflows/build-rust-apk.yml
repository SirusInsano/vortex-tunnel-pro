name: Build Vortex Tunnel Pro (Rust Android APK + Windows EXE)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-rust:
    name: "1. Compilar Motor Rust p/ Windows (.EXE)"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Compilar e Testar Binário Nativo Rust (vortex-core.exe)
        working-directory: rust-core
        run: |
          cargo build --release
          ./target/release/vortex-core.exe --test

      - name: Publicar Executável Windows (vortex-core.exe)
        uses: actions/upload-artifact@v4
        with:
          name: VortexTunnelPro-Windows-Rust-EXE
          path: rust-core/target/release/vortex-core.exe

  build-android-rust-apk:
    name: "2. Compilar Rust ARM64 (libvortex_core.so) + Empacotar APK + Publicar Release"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Rust + Target Android ARM64 (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk

      - name: Compilar Motor Rust Nativo para Android ARM64 (libvortex_core.so)
        working-directory: rust-core
        run: |
          cargo ndk -t arm64-v8a -o ../android/app/src/main/jniLibs build --release
          ls -lh ../android/app/src/main/jniLibs/arm64-v8a/libvortex_core.so

      - name: Configurar Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Gerar APK Assinado (VortexTunnelPro.apk)
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../VortexTunnelPro.apk

      - name: Publicar APK Android nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VortexTunnelPro-Android-Rust-APK
          path: VortexTunnelPro.apk

      - name: Publicar Link Direto no GitHub Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Vortex Tunnel Pro v2.2 (Rust Core ARM64 + Auto-Update OTA)"
          body: |
            ### Download Direto (Sem precisar de Tailscale):
            - 📱 **Android APK (Motor Rust ARM64 + Auto-Update OTA):** Baixe `VortexTunnelPro.apk` abaixo.
          prerelease: false
          files: |
            VortexTunnelPro.apk
